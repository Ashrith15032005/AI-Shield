[project]
name = "aishield"
version = "0.1.0"
description = "Real-time fraud detection MLOps platform with drift detection, self-healing, and an LLM copilot."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint.main]
disable = ["missing-module-docstring", "too-few-public-methods"]
max-line-length = 100
